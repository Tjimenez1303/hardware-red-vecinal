<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Hardware Red Vecinal</title>
<script>try{var t=localStorage.getItem("rv-tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/comun.css">
<style>
  /* Catálogo, página principal. Casilla «Comparar» siempre visible y bandeja persistente de lo
     elegido (Baymard); la comparación se abre encima, sin perder el contexto del catálogo. */
  main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 140px; }
  .cabecera { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
  h1 { font-size: clamp(26px, 3.6vw, 36px); letter-spacing: -0.02em; margin: 0; }
  .cabecera p { margin: 4px 0 0; color: var(--ink-2); }
  .herramientas { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 22px 0 10px; }
  .herramientas input[type="search"] { flex: 1 1 240px; max-width: 360px; }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .filtro { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
  .filtro[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .filtro svg { width: 14px; height: 14px; }
  .conteo { font-size: 13.5px; color: var(--ink-3); margin-left: auto; }

  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 36px 24px; list-style: none; padding: 0; margin: 0; }
  .item { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .item .foto { aspect-ratio: 1; padding: 16px; margin-bottom: 10px; position: relative; }
  .item .aviso { position: absolute; top: 10px; left: 10px; font-size: 12px; background: #18181a; color: #ffffff; padding: 2px 9px; border-radius: 999px; z-index: 1; }
  .item .fab { font-size: 12.5px; color: var(--ink-3); }
  .item h2 { font-size: 16px; font-weight: 600; margin: 0; line-height: 1.3; }
  .item .res { font-size: 13.5px; color: var(--ink-2); }
  .item .pie { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .item .precio { font-size: 16px; }
  .comparar { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
  .comparar input { width: 17px; height: 17px; accent-color: var(--ink); margin: 0; }
  .vacio { padding: 60px 0; text-align: center; color: var(--ink-2); }

  .bandeja { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%); transition: transform .25s; z-index: 40;
    display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 16px; max-width: calc(100% - 32px);
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 30px rgb(0 0 0 / .14); }
  .bandeja.visible { transform: translate(-50%, 0); }
  .bandeja ul { display: flex; gap: 10px; list-style: none; margin: 0; padding: 0; overflow-x: auto; }
  .bandeja li { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 10px; padding: 4px 6px 4px 8px; font-size: 13px; white-space: nowrap; }
  .bandeja li .foto { width: 34px; height: 34px; padding: 2px; border-radius: 6px; }
  .bandeja li button { border: 0; background: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; color: var(--ink-3); display: grid; place-items: center; }
  .bandeja li button:hover { background: var(--surface); color: var(--ink); }
  .bandeja li button svg { width: 15px; height: 15px; }
  .bandeja .hueco { border: 1px dashed var(--line); background: none; color: var(--ink-3); padding: 10px 14px; }
  .bandeja .btn:disabled { opacity: .45; cursor: default; }

  dialog { border: 0; padding: 0; width: min(1100px, calc(100% - 32px)); max-height: calc(100% - 48px); border-radius: 18px; background: var(--bg); color: var(--ink); box-shadow: 0 30px 80px rgb(0 0 0 / .35); }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  .hoja-cab { position: sticky; top: 0; background: var(--bg); z-index: 2; display: grid; grid-template-columns: 180px repeat(var(--k), minmax(0, 1fr)); gap: 16px; padding: 18px 24px 14px; border-bottom: 1px solid var(--line); align-items: end; }
  .hoja-cab .titulo { font-weight: 600; font-size: 18px; align-self: center; }
  .hoja-cab .p { text-align: center; font-size: 14px; }
  .hoja-cab .p .foto { width: 96px; height: 96px; margin: 0 auto 6px; padding: 6px; border-radius: 10px; }
  .hoja-pie { display: flex; justify-content: flex-end; padding: 0 24px 22px; }
  .hoja-cab .p b { display: block; }
  .cerrar { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface-2); cursor: pointer; display: grid; place-items: center; }
  .cerrar svg { width: 18px; height: 18px; }
  .hoja-cuerpo { padding: 4px 24px 28px; }
  .hoja-cuerpo h3 { font-size: 16px; margin: 22px 0 2px; }
  .hoja-fila { display: grid; grid-template-columns: 180px repeat(var(--k), minmax(0, 1fr)); gap: 16px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
  .hoja-fila .t { color: var(--ink-2); font-size: 13.5px; }
  .hoja-fila .c { text-align: center; display: flex; flex-direction: column; align-items: center; }

  @media (max-width: 640px) {
    main { padding: 20px 16px 150px; }
    .grilla { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 14px; }
    .hoja-cab, .hoja-fila { grid-template-columns: repeat(var(--k), minmax(0, 1fr)); }
    .hoja-cab .titulo { display: none; }
    .hoja-fila .t { grid-column: 1 / -1; text-align: center; }
  }
</style>
</head>
<body>
<header id="barra"></header>
<main>
  <div class="cabecera">
    <div>
      <h1>Hardware para la Red Vecinal</h1>
      <p>Los equipos para la capa fija y la portátil, con precio de lista y enlace a la tienda. Marca «Comparar» en hasta tres y ábrelos lado a lado.</p>
    </div>
  </div>
  <div class="herramientas">
    <div class="segmentado" id="capas" role="tablist" aria-label="Tipo de equipo"></div>
    <label class="visually-hidden" for="buscar">Buscar</label>
    <input type="search" id="buscar" placeholder="Buscar por nombre o fabricante">
    <label class="visually-hidden" for="orden">Ordenar</label>
    <select id="orden">
      <option value="precio">Más baratos primero</option>
      <option value="bateria">Más batería primero</option>
      <option value="peso">Más livianos primero</option>
      <option value="nombre">Por nombre</option>
    </select>
  </div>
  <div class="filtros" id="filtros"></div>
  <ul class="grilla" id="grilla"></ul>
</main>

<div class="bandeja" id="bandeja" role="region" aria-label="Equipos para comparar">
  <ul id="bandeja-lista"></ul>
  <button class="btn btn-primario" type="button" id="abrir">Comparar</button>
</div>

<dialog id="hoja" aria-labelledby="hoja-titulo">
  <button class="cerrar" type="button" id="cerrar" aria-label="Cerrar la comparación"></button>
  <div id="hoja-contenido"></div>
</dialog>

<script src="assets/comun.js"></script>
<script>
(async function () {
  const { esc, usd, n, foto, resumen, nombre, filasPara, CAPAS, ICONOS, barra, cargar, guardarSeleccion } = RV;
  let d;
  try { d = await cargar(); } catch (err) { document.getElementById("grilla").textContent = "No se pudieron cargar los datos: " + err.message; return; }
  barra("index.html", d.meta.fecha_datos);
  document.getElementById("cerrar").innerHTML = ICONOS.cerrar;
  const eq = d.equipos;
  const porId = new Map(eq.map((e) => [e.id, e]));
  const MAX = 3;
  const estado = { capa: "portatil", texto: "", orden: "precio", filtros: new Set(), sel: [] };

  const FILTROS = [
    ["listo", "Llega con Meshtastic", (e) => e.r.listo === true],
    ["sincel", "Funciona sin celular", (e) => e.r.sinCelular === "total" || e.r.sinCelular === "lee", ["portatil"]],
    ["agua", "Resiste agua", (e) => e.r.agua === true],
    ["stock", "En stock", (e) => e.r.disponible === true],
    ["co", "Se vende en Colombia", (e) => e.r.colombia === true],
  ];

  function pintarCapas() {
    document.getElementById("capas").innerHTML = Object.entries(CAPAS).map(([k, c]) =>
      `<button type="button" role="tab" aria-selected="${k === estado.capa}" data-k="${k}">${c.plural}<span class="cuenta">${eq.filter((e) => e.capa === k).length}</span></button>`).join("");
    document.getElementById("filtros").innerHTML = FILTROS.filter((f) => !f[3] || f[3].includes(estado.capa)).map(([k, t]) =>
      `<button type="button" class="filtro" data-f="${k}" aria-pressed="${estado.filtros.has(k)}">${estado.filtros.has(k) ? ICONOS.si : ""}${t}</button>`).join("") + `<span class="conteo" id="conteo"></span>`;
  }

  function lista() {
    const t = estado.texto.trim().toLowerCase();
    const fs = FILTROS.filter(([k]) => estado.filtros.has(k));
    const l = eq.filter((e) => e.capa === estado.capa && (!t || `${e.fabricante} ${e.modelo}`.toLowerCase().includes(t)) && fs.every((f) => f[2](e)));
    const clave = { precio: (e) => e.r.precio, bateria: (e) => (e.r.bateria === null ? null : -e.r.bateria), peso: (e) => e.r.peso, nombre: null }[estado.orden];
    return l.sort((a, b) => {
      if (!clave) return nombre(a).localeCompare(nombre(b), "es");
      const va = clave(a), vb = clave(b);
      if (va === null && vb === null) return 0; if (va === null) return 1; if (vb === null) return -1;
      return va - vb;
    });
  }

  function pintarGrilla() {
    const l = lista();
    document.getElementById("conteo").textContent = `${l.length} ${l.length === 1 ? "equipo" : "equipos"}`;
    document.getElementById("grilla").innerHTML = l.map((e) => {
      const marcado = estado.sel.includes(e.id);
      const lleno = !marcado && estado.sel.length >= MAX;
      const aviso = e.disponibilidad === "agotado" ? "Agotado" : e.linea_base ? "Línea base del proyecto" : e.nuevo ? "Nuevo en el catálogo" : "";
      return `<li class="item">
        <div class="foto marco-foto">${aviso ? `<span class="aviso">${aviso}</span>` : ""}${foto(e)}</div>
        <span class="fab">${esc(e.fabricante)}</span>
        <h2>${esc(nombre(e))}</h2>
        <span class="res">${esc(resumen(e)) || "&nbsp;"}</span>
        <div class="pie">
          ${e.r.precio !== null ? `<a class="precio" href="${esc(e.url)}" target="_blank" rel="noopener">${usd(e.r.precio)}</a>` : `<span class="sin-dato">Sin dato</span>`}
          <label class="comparar"><input type="checkbox" data-id="${esc(e.id)}" ${marcado ? "checked" : ""} ${lleno ? "disabled" : ""}> Comparar</label>
        </div>
      </li>`;
    }).join("") || `<li class="vacio">Ningún equipo cumple estos filtros.</li>`;
  }

  function pintarBandeja() {
    const b = document.getElementById("bandeja");
    b.classList.toggle("visible", estado.sel.length > 0);
    const items = estado.sel.map((id) => porId.get(id)).map((e) =>
      `<li><span class="foto marco-foto">${foto(e, "")}</span>${esc(nombre(e))}<button type="button" data-quitar="${esc(e.id)}" aria-label="Quitar ${esc(nombre(e))}">${ICONOS.cerrar}</button></li>`);
    const huecos = MAX - estado.sel.length;
    if (huecos > 0 && estado.sel.length) items.push(`<li class="hueco">Puedes añadir ${huecos} más</li>`);
    document.getElementById("bandeja-lista").innerHTML = items.join("");
    const abrir = document.getElementById("abrir");
    abrir.disabled = estado.sel.length < 2;
    abrir.textContent = estado.sel.length < 2 ? "Elige al menos dos" : `Comparar ${estado.sel.length}`;
    guardarSeleccion(estado.sel);
  }

  function abrirHoja() {
    const l = estado.sel.map((id) => porId.get(id));
    const k = l.length;
    const cab = `<div class="hoja-cab" style="--k:${k}"><span class="titulo" id="hoja-titulo">Comparación</span>${l.map((e) =>
      `<div class="p"><div class="foto marco-foto">${foto(e, "")}</div><b>${esc(nombre(e))}</b><span class="sub">${esc(e.fabricante)}</span></div>`).join("")}</div>`;
    const cuerpo = filasPara(l).map((g) => `<h3>${esc(g.titulo)}</h3>` + g.filas.map((f) =>
      `<div class="hoja-fila" style="--k:${k}"><span class="t">${esc(f.t)}</span>${f.celdas.map((c, i) => `<div class="c ${f.mejores.includes(i) ? "celda-mejor" : ""}">${c}</div>`).join("")}</div>`).join("")).join("");
    document.getElementById("hoja-contenido").innerHTML = cab + `<div class="hoja-cuerpo">${cuerpo}</div><div class="hoja-pie"><a class="btn btn-secundario" href="comparar.html">Abrir en la página de comparación</a></div>`;
    document.getElementById("hoja").showModal();
  }

  document.getElementById("capas").addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    estado.capa = b.dataset.k; estado.filtros.clear(); pintarCapas(); pintarGrilla();
  });
  document.getElementById("filtros").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-f]"); if (!b) return;
    const k = b.dataset.f; estado.filtros.has(k) ? estado.filtros.delete(k) : estado.filtros.add(k);
    pintarCapas(); pintarGrilla();
  });
  document.getElementById("buscar").addEventListener("input", (ev) => { estado.texto = ev.target.value; pintarGrilla(); });
  document.getElementById("orden").addEventListener("change", (ev) => { estado.orden = ev.target.value; pintarGrilla(); });
  document.getElementById("grilla").addEventListener("change", (ev) => {
    const c = ev.target.closest("input[data-id]"); if (!c) return;
    const id = c.dataset.id;
    estado.sel = c.checked ? [...estado.sel, id].slice(0, MAX) : estado.sel.filter((x) => x !== id);
    pintarGrilla(); pintarBandeja();
  });
  document.getElementById("bandeja-lista").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-quitar]"); if (!b) return;
    estado.sel = estado.sel.filter((x) => x !== b.dataset.quitar); pintarGrilla(); pintarBandeja();
  });
  document.getElementById("abrir").addEventListener("click", abrirHoja);
  document.getElementById("cerrar").addEventListener("click", () => document.getElementById("hoja").close());

  // Ejemplo de partida: dos equipos ya marcados, para que la bandeja se vea desde el inicio.
  estado.sel = ["seeed-studio-sensecap-card-tracker-t1000-e", "elecrow-thinknode-m1"].filter((id) => porId.has(id));
  pintarCapas(); pintarGrilla(); pintarBandeja();
})();
</script>
</body>
</html>
